[package]
name = "kaage-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kaage-proto = { path = "../kaage-proto" }
serde.workspace = true
postcard.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.37"
ewebsock = "0.8"
vt100 = "0.16"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
ghostty-vt = { version = "0.8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlCanvasElement"] }

[features]
default = []
ghostty = ["dep:ghostty-vt"]

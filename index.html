<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>kaage</title>
  <link data-trunk rel="rust" href="crates/kaage-ui/Cargo.toml" data-wasm-opt="z" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      background-image: radial-gradient(#262d38 1px, transparent 1px);
      background-size: 24px 24px;
      color: #f2f5fa;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #kaage_loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: #0d0f12;
      background-image: radial-gradient(#262d38 1px, transparent 1px);
      background-size: 24px 24px;
      z-index: 9000;
      transition: opacity 0.25s ease-out;
    }
    #kaage_loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .kaage-spinner {
      width: 42px;
      height: 42px;
      border: 2.5px solid #242a36;
      border-top-color: #ffb838;
      border-right-color: #ffb838;
      border-radius: 50%;
      animation: kaage-spin 0.8s linear infinite;
    }
    .kaage-brand {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #f2f5fa;
    }
    .kaage-brand span {
      color: #ffb838;
    }
    .kaage-sub {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #aeb9ca;
      letter-spacing: 0.04em;
    }
    @keyframes kaage-spin {
      to { transform: rotate(360deg); }
    }
    #kaage_error {
      display: none;
      position: fixed;
      inset: 24px;
      padding: 16px;
      background: #16191e;
      color: #f87171;
      border: 1px solid #f87171;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      white-space: pre-wrap;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <canvas id="kaage_canvas"></canvas>
  <div id="kaage_loader" role="status" aria-live="polite">
    <div class="kaage-spinner"></div>
    <div class="kaage-brand"><span>kaage</span> · ಕಾಗೆ · 影</div>
    <div class="kaage-sub">Loading WebAssembly cockpit…</div>
  </div>
  <div id="kaage_error"></div>
</body>
</html>

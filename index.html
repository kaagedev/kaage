<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>kaage</title>
  <link data-trunk rel="rust" href="crates/kaage-ui/Cargo.toml" data-wasm-opt="z" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      background-image: radial-gradient(#262d38 1px, transparent 1px);
      background-size: 24px 24px;
      color: #f2f5fa;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #kaage_loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: #0d0f12;
      background-image: radial-gradient(#262d38 1px, transparent 1px);
      background-size: 24px 24px;
      z-index: 9000;
      transition: opacity 0.25s ease-out;
    }
    #kaage_loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .kaage-spinner {
      width: 42px;
      height: 42px;
      border: 2.5px solid #242a36;
      border-top-color: #ffb838;
      border-right-color: #ffb838;
      border-radius: 50%;
      animation: kaage-spin 0.8s linear infinite;
    }
    .kaage-brand {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #f2f5fa;
    }
    .kaage-brand span {
      color: #ffb838;
    }
    .kaage-sub {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #aeb9ca;
      letter-spacing: 0.04em;
    }
    @keyframes kaage-spin {
      to { transform: rotate(360deg); }
    }
    #kaage_error {
      display: none;
      position: fixed;
      inset: 24px;
      padding: 16px;
      background: #16191e;
      color: #f87171;
      border: 1px solid #f87171;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      white-space: pre-wrap;
      z-index: 9999;
    }
    /* Hybrid DOM Overlay for Kaage Copilot */
    #kaage_dom_overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 400;
    }
    .kaage-copilot-pane {
      position: fixed;
      top: 0;
      left: 0;
      display: none;
      flex-direction: column;
      background: var(--kaage-panel, #16191e);
      color: var(--kaage-text, #f2f5fa);
      font-family: "IBM Plex Sans", -apple-system, sans-serif;
      font-size: 13px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .kc-header {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 6px 8px;
      border-bottom: 1px solid var(--kaage-border, #3e4858);
      background: var(--kaage-alt, #212731);
    }
    .kc-title { font-weight: 600; color: var(--kaage-accent, #ffb838); margin-right: 4px; }
    .kc-pill {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10.5px;
      padding: 1px 6px;
      border: 1px solid var(--kaage-border, #3e4858);
      background: var(--kaage-well, #101216);
      color: var(--kaage-muted, #aeb9ca);
    }
    .kc-messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .kc-msg { padding: 8px; border: 1px solid var(--kaage-border, #3e4858); background: var(--kaage-well, #101216); }
    .kc-user { border-left: 3px solid var(--kaage-accent, #ffb838); background: var(--kaage-alt, #212731); }
    .kc-role {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      color: var(--kaage-accent, #ffb838);
      margin-bottom: 3px;
    }
    .kc-ts {
      font-family: "IBM Plex Mono", monospace;
      font-size: 9.5px;
      color: var(--kaage-muted, #aeb9ca);
      opacity: 0.65;
    }
    .kc-body { white-space: pre-wrap; line-height: 1.45; }
    .kc-md { line-height: 1.5; word-break: break-word; }
    .kc-md p { margin: 0 0 6px 0; }
    .kc-md p:last-child { margin-bottom: 0; }
    .kc-h1, .kc-h2, .kc-h3, .kc-h4, .kc-h5, .kc-h6 {
      margin: 8px 0 4px 0;
      font-weight: 600;
      color: var(--kaage-accent, #ffb838);
      line-height: 1.3;
    }
    .kc-h1 { font-size: 16px; border-bottom: 1px solid var(--kaage-border, #3e4858); padding-bottom: 2px; }
    .kc-h2 { font-size: 14.5px; }
    .kc-h3 { font-size: 13.5px; }
    .kc-h4, .kc-h5, .kc-h6 { font-size: 13px; }
    .kc-code {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11.5px;
      padding: 1px 4px;
      background: var(--kaage-bg, #0d0f12);
      border: 1px solid var(--kaage-border, #3e4858);
      color: var(--kaage-accent, #ffb838);
    }
    .kc-codeblock {
      margin: 6px 0;
      border: 1px solid var(--kaage-border, #3e4858);
      background: var(--kaage-bg, #0d0f12);
    }
    .kc-code-lang {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      color: var(--kaage-muted, #aeb9ca);
      padding: 2px 6px;
      border-bottom: 1px solid var(--kaage-border, #3e4858);
      background: var(--kaage-alt, #212731);
      text-transform: uppercase;
    }
    .kc-codeblock .kc-pre { margin: 0; border: none; }
    .kc-list { margin: 4px 0 6px 0; padding-left: 18px; }
    .kc-list li { margin: 2px 0; }
    .kc-quote {
      margin: 6px 0;
      padding: 4px 8px;
      border-left: 3px solid var(--kaage-accent, #ffb838);
      background: var(--kaage-alt, #212731);
      color: var(--kaage-muted, #aeb9ca);
    }
    .kc-hr { border: none; border-top: 1px solid var(--kaage-border, #3e4858); margin: 8px 0; }
    .kc-table {
      width: 100%;
      border-collapse: collapse;
      margin: 6px 0;
      font-size: 12px;
    }
    .kc-table th, .kc-table td {
      border: 1px solid var(--kaage-border, #3e4858);
      padding: 4px 6px;
      text-align: left;
    }
    .kc-table th {
      background: var(--kaage-alt, #212731);
      color: var(--kaage-accent, #ffb838);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
    }
    .kc-link { color: var(--kaage-sky, #60c4ff); text-decoration: underline; }
    .kc-cursor { color: var(--kaage-accent, #ffb838); }
    .kc-think {
      margin: 4px 0 8px 0;
      border: 1px dashed var(--kaage-border, #3e4858);
      background: var(--kaage-bg, #0d0f12);
      padding: 4px 8px;
    }
    .kc-think summary {
      cursor: pointer;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10.5px;
      color: var(--kaage-muted, #aeb9ca);
      user-select: none;
    }
    .kc-think-body {
      margin-top: 4px;
      font-size: 12px;
      color: var(--kaage-muted, #aeb9ca);
      border-top: 1px solid var(--kaage-border, #3e4858);
      padding-top: 4px;
    }
    .kc-tool { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--kaage-sky, #60c4ff); }
    .kc-notice { font-size: 11.5px; color: var(--kaage-muted, #aeb9ca); font-style: italic; }
    .kc-memory { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--kaage-sky, #60c4ff); padding: 4px 6px; border: 1px dashed var(--kaage-border, #3e4858); }
    .kc-card { border: 1px solid var(--kaage-accent, #ffb838); background: var(--kaage-well, #101216); padding: 8px; }
    .kc-confirm { border-color: var(--kaage-red, #f87171); }
    .kc-card-hdr { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--kaage-accent, #ffb838); margin-bottom: 4px; }
    .kc-pre { margin: 4px 0; padding: 6px; background: var(--kaage-bg, #0d0f12); font-family: "IBM Plex Mono", monospace; font-size: 11px; overflow-x: auto; white-space: pre-wrap; }
    .kc-err { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--kaage-red, #f87171); }
    .kc-sub { font-size: 11px; color: var(--kaage-muted, #aeb9ca); }
    .kc-kv { display: flex; justify-content: space-between; font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 1px 0; }
    .kc-spark { width: 100%; height: 36px; display: block; margin: 4px 0; background: var(--kaage-bg, #0d0f12); }
    .kc-actions { display: flex; gap: 6px; margin-top: 6px; }
    .kc-composer {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      border-top: 1px solid var(--kaage-border, #3e4858);
      background: var(--kaage-alt, #212731);
    }
    .kc-composer textarea {
      flex: 1;
      resize: none;
      background: var(--kaage-well, #101216);
      color: var(--kaage-text, #f2f5fa);
      border: 1px solid var(--kaage-border, #3e4858);
      padding: 6px;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 13px;
      outline: none;
    }
    .kc-composer textarea:focus { border-color: var(--kaage-accent, #ffb838); }
    .kc-btn {
      background: var(--kaage-alt, #212731);
      color: var(--kaage-text, #f2f5fa);
      border: 1px solid var(--kaage-border, #3e4858);
      padding: 4px 10px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      cursor: pointer;
    }
    .kc-btn:hover { border-color: var(--kaage-accent, #ffb838); }
    .kc-btn-primary { border-color: var(--kaage-accent, #ffb838); color: var(--kaage-accent, #ffb838); }
    .kc-btn-danger { border-color: var(--kaage-red, #f87171); color: var(--kaage-red, #f87171); }
  </style>
</head>
<body>
  <canvas id="kaage_canvas"></canvas>
  <div id="kaage_dom_overlay"></div>
  <div id="kaage_loader" role="status" aria-live="polite">
    <div class="kaage-spinner"></div>
    <div class="kaage-brand"><span>kaage</span> · ಕಾಗೆ · 影</div>
    <div class="kaage-sub">Loading WebAssembly cockpit…</div>
  </div>
  <div id="kaage_error"></div>
</body>
</html>
